
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% if mode == "edit" %}Edit{% else %}Add{% endif %} article</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--primary:#0ea5a4;--primary-dark:#0b7f7e;--border:#e5e7eb;--shadow:0 12px 28px rgba(0,0,0,.10);--radius:18px;}
    body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--text);}
    .container{max-width:900px;margin:26px auto;padding:0 18px;}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;}
    h1{margin:0 0 6px;font-size:30px;}
    .muted{color:var(--muted);}
    .btn{background:var(--primary);color:#fff;border:none;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;}
    .btn:hover{background:var(--primary-dark);}
    .btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
    .btn-ghost:hover{background:#f3f4f6;}
    label{font-weight:800;display:block;margin-top:12px;}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--border);margin-top:6px;}
    textarea{min-height:110px;}
    .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
    nav a{color:var(--muted);text-decoration:none;margin:0 10px;font-weight:650;}
    nav a:hover{color:var(--text);}
  </style>
</head>
<body>
   

  <main class="container">
    <div class="card">
      <h1>{% if mode == "edit" %}Edit{% else %}Add{% endif %} article</h1>
      <div class="muted">Only doctors can create/edit articles. You can only modify your own.</div>

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <label>Title</label>
        <input name="title" value="{% if article %}{{ article.title }}{% endif %}" required>

        <label>Category</label>
        <select name="category">
          {% for key,label in categories %}
            <option value="{{ key }}" {% if article and article.category == key %}selected{% endif %}>{{ label }}</option>
          {% endfor %}
        </select>

        <label>Summary</label>
        <textarea name="summary">{% if article %}{{ article.summary }}{% endif %}</textarea>

        <label>PDF (optional)</label>
        <input type="file" name="pdf" accept="application/pdf">

        <div class="row">
          <button class="btn" type="submit">{% if mode == "edit" %}Save{% else %}Create{% endif %}</button>
          <a class="btn btn-ghost" href="{% url 'articles:list' %}">Back</a>
        </div>
      </form>
    </div>
  </main>
</body>
</html>
